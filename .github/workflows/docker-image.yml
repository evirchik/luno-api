name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run application
        run: |
          docker run -d -p 8080:8080 --name my-app my-app
          sleep 30
          docker logs my-app
